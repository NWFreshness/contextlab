[project]
name = "contextlab"
version = "0.1.0"
description = "Local hybrid retrieval stack for teaching AI engineering"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "tiktoken>=0.7",
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
